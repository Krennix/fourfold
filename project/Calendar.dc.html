<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./assets/ds/styles.css">
<script src="_ds/industry-fccfab8c-a272-485d-8ff4-a29b0928eafa/_ds_bundle.js"></script>
<style>
.widget{position:relative;border:1px solid var(--color-divider);border-radius:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);background:transparent}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb, var(--color-text) 55%, transparent);text-align:left;padding:2px 4px}
.day-cell{min-height:104px;border:1px solid var(--color-divider);border-radius:0;padding:6px;display:flex;flex-direction:column;gap:4px;background:transparent}
.day-cell.blank{border-color:transparent}
.day-cell.today{border-color:var(--color-accent);border-width:1.5px}
.day-num{font-family:var(--font-heading);font-size:13px;font-weight:600}
.day-cell.today .day-num{color:var(--color-accent-700)}
.evt-chip{font-size:10.5px;padding:2px 6px;border-radius:0;background:var(--color-accent-100);color:var(--color-accent-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:3px}
.evt-chip.google{background:var(--color-neutral-200);color:var(--color-neutral-800)}
.evt-chip svg{width:9px;height:9px;flex:none}
.view-toggle{display:flex;border:1px solid var(--color-divider)}
.view-toggle button{border:none;background:transparent;padding:6px 14px;font-size:12.5px;font-family:var(--font-body);color:var(--color-text);cursor:pointer}
.view-toggle button.active{background:var(--color-accent);color:var(--color-bg)}
.day-time-grid{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px}
.time-label{font-size:10.5px;color:color-mix(in srgb, var(--color-text) 45%, transparent);text-align:right;padding-right:6px;padding-top:2px}
.day-time-col{position:relative;grid-column:1/2;display:flex;flex-direction:column}
.day-events-col{position:relative;border-left:1px solid var(--color-divider);min-height:720px}
.day-event-block{position:absolute;left:4px;right:4px;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800);padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day-event-block.google{border-color:var(--color-neutral-400, var(--color-divider));background:var(--color-neutral-200);color:var(--color-neutral-800)}
.day-event-block .de-title{font-family:var(--font-heading);font-weight:600;font-size:13px;line-height:1.15;display:flex;align-items:center;gap:4px}
.day-event-block .de-title svg{width:11px;height:11px;flex:none}
.day-event-block .de-time{font-size:10.5px;opacity:.8}
.now-time{position:absolute;right:6px;width:50px;text-align:right;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--now-color, #f04949);white-space:nowrap}
.now-dot{position:absolute;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--now-color, #f04949);transform:translate(50%,-50%);z-index:6}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--now-color, #f04949);transform:translateY(-50%);z-index:6}
</style>
</helmet>
<div style="display:flex;min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">
<dc-import name="Sidebar" active="calendar" hint-size="220px,100%"></dc-import>
<main style="flex:1;min-width:0;padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-6);max-width:1320px">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap">
    <div>
      <h6 class="text-muted" style="margin-bottom:6px">Schedule</h6>
      <h1 style="font-size:34px">Calendar</h1>
    </div>
    <div style="display:flex;align-items:center;gap:var(--space-2)">
      <span class="tag tag-outline">Synced with Google</span>
      <button class="btn btn-secondary" type="button" onClick="{{ sync }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"></path><path d="M21 4v5h-5"></path></svg>
        Sync now
      </button>
      <button class="btn btn-primary" type="button" onClick="{{ openDialog }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        Add event
      </button>
    </div>
  </div>

  <div class="widget blueprint">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="widget-head" style="justify-content:flex-start;gap:var(--space-3);flex-wrap:wrap">
      <sc-if value="{{ isMonthView }}" hint-placeholder-val="{{ true }}">
        <button class="btn btn-icon" type="button" onClick="{{ prevMonth }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></button>
        <h3 style="min-width:200px">{{ monthLabel }}</h3>
        <button class="btn btn-icon" type="button" onClick="{{ nextMonth }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
      </sc-if>
      <sc-if value="{{ isDayView }}" hint-placeholder-val="{{ false }}">
        <button class="btn btn-icon" type="button" onClick="{{ prevDay }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></button>
        <h3 style="min-width:200px">{{ dayLabel }}</h3>
        <button class="btn btn-icon" type="button" onClick="{{ nextDay }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
      </sc-if>
      <button class="btn btn-secondary" type="button" onClick="{{ goToday }}" style="margin-left:var(--space-2)">Today</button>
      <div class="view-toggle" style="margin-left:auto">
        <button type="button" class="{{ monthToggleClass }}" onClick="{{ showMonth }}">Month</button>
        <button type="button" class="{{ dayToggleClass }}" onClick="{{ showDay }}">Day</button>
      </div>
    </div>

    <sc-if value="{{ isMonthView }}" hint-placeholder-val="{{ true }}">
      <div class="month-grid">
        <sc-for list="{{ dowLabels }}" as="d" hint-placeholder-count="7"><div class="dow">{{ d }}</div></sc-for>
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
          <div class="day-cell {{ c.cls }}" onClick="{{ c.open }}" style="cursor:pointer">
            <sc-if value="{{ c.inMonth }}" hint-placeholder-val="{{ true }}">
              <span class="day-num">{{ c.num }}</span>
              <sc-for list="{{ c.events }}" as="ev" hint-placeholder-count="1">
                <span class="evt-chip {{ ev.cls }}">
                  <sc-if value="{{ ev.linked }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="9" height="6" rx="3"></rect><rect x="10" y="10" width="9" height="6" rx="3"></rect></svg></sc-if>
                  {{ ev.time }} {{ ev.title }}
                </span>
              </sc-for>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ isDayView }}" hint-placeholder-val="{{ false }}">
      <div class="day-time-grid">
        <div class="day-time-col">
          <sc-for list="{{ dayHourLabels }}" as="h" hint-placeholder-count="16"><div class="time-label" style="height:44px">{{ h }}</div></sc-for>
          <sc-if value="{{ showNowLine }}" hint-placeholder-val="{{ false }}">
            <span class="now-time" style="top:{{ nowTopPct }}%">{{ nowLabel }}</span>
            <span class="now-dot" style="top:{{ nowTopPct }}%"></span>
          </sc-if>
        </div>
        <div class="day-events-col">
          <sc-for list="{{ dayEvents }}" as="ev" hint-placeholder-count="4">
            <div class="day-event-block {{ ev.cls }}" style="{{ ev.posStyle }}">
              <span class="de-title">
                <sc-if value="{{ ev.linked }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="9" height="6" rx="3"></rect><rect x="10" y="10" width="9" height="6" rx="3"></rect></svg></sc-if>
                {{ ev.title }}
              </span>
              <span class="de-time">{{ ev.time }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ showNowLine }}" hint-placeholder-val="{{ false }}">
            <div class="now-line" style="top:{{ nowTopPct }}%"></div>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ dialogOpen }}" hint-placeholder-val="{{ false }}">
    <div class="dialog-backdrop" onClick="{{ closeDialog }}">
      <div class="dialog" onClick="{{ stop }}">
        <div class="dialog-title">Add event</div>
        <div class="field"><label>Title</label><input class="input" type="text" ref="{{ titleRef }}" placeholder="Event title"></div>
        <div style="display:flex;gap:var(--space-3)">
          <div class="field" style="flex:1"><label>Date</label><input class="input" type="date" ref="{{ dateRef }}"></div>
          <div class="field" style="flex:1"><label>Time</label><input class="input" type="time" ref="{{ timeRef }}"></div>
        </div>
        <div class="field">
          <label>Link to</label>
          <select class="input" ref="{{ linkRef }}">
            <option value="">No link</option>
            <option value="task">Eisenhower task&hellip;</option>
            <option value="habit">Habit&hellip;</option>
          </select>
        </div>
        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" onClick="{{ closeDialog }}">Cancel</button>
          <button class="btn btn-primary" type="button" onClick="{{ saveEvent }}">Save to Google Calendar</button>
        </div>
      </div>
    </div>
  </sc-if>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const DAY_START_HOUR = 6;
const DAY_END_HOUR = 22;

class Component extends DCLogic {
  state = { viewYear: null, viewMonth: null, viewMode: 'month', dayDate: null, dialogOpen: false, extraEvents: [] };

  componentDidMount() {
    const now = new Date();
    this.setState({ viewYear: now.getFullYear(), viewMonth: now.getMonth(), dayDate: new Date(now.getFullYear(), now.getMonth(), now.getDate()) });
  }

  prevMonth() { this.setState(s => { let m = s.viewMonth - 1, y = s.viewYear; if (m < 0) { m = 11; y--; } return { viewMonth: m, viewYear: y }; }); }
  nextMonth() { this.setState(s => { let m = s.viewMonth + 1, y = s.viewYear; if (m > 11) { m = 0; y++; } return { viewMonth: m, viewYear: y }; }); }
  goToday() {
    const now = new Date();
    this.setState({ viewYear: now.getFullYear(), viewMonth: now.getMonth(), dayDate: new Date(now.getFullYear(), now.getMonth(), now.getDate()) });
  }
  showMonth() { this.setState({ viewMode: 'month' }); }
  showDay() { this.setState(s => ({ viewMode: 'day', dayDate: s.dayDate || new Date() })); }
  prevDay() { this.setState(s => { const d = new Date(s.dayDate); d.setDate(d.getDate() - 1); return { dayDate: d }; }); }
  nextDay() { this.setState(s => { const d = new Date(s.dayDate); d.setDate(d.getDate() + 1); return { dayDate: d }; }); }
  openDay(year, month, day) { this.setState({ viewMode: 'day', dayDate: new Date(year, month, day) }); }
  sync() {}
  openDialog() { this.setState({ dialogOpen: true }); }
  closeDialog() { this.setState({ dialogOpen: false }); }
  stop(e) { e.stopPropagation(); }
  saveEvent() {
    const title = this.titleRef && this.titleRef.value ? this.titleRef.value : 'New event';
    const date = this.dateRef && this.dateRef.value ? this.dateRef.value : null;
    const time = this.timeRef && this.timeRef.value ? this.timeRef.value : '';
    if (date) {
      this.setState(s => ({ extraEvents: [...s.extraEvents, { date, title, time }], dialogOpen: false }));
    } else {
      this.setState({ dialogOpen: false });
    }
  }

  renderVals() {
    const titleRef = (el) => { this.titleRef = el; };
    const dateRef = (el) => { this.dateRef = el; };
    const timeRef = (el) => { this.timeRef = el; };
    const linkRef = (el) => { this.linkRef = el; };

    if (this.state.viewYear === null) {
      return { monthLabel: '', dowLabels: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], cells: [], dialogOpen: false,
        isMonthView: true, isDayView: false, monthToggleClass: 'active', dayToggleClass: '',
        dayLabel: '', dayHourLabels: [], dayEvents: [], showNowLine: false, nowTopPct: 0, nowLabel: '',
        openDialog: () => this.openDialog(), closeDialog: () => this.closeDialog(), stop: () => {},
        prevMonth: () => {}, nextMonth: () => {}, goToday: () => {}, sync: () => {}, saveEvent: () => {},
        showMonth: () => {}, showDay: () => {}, prevDay: () => {}, nextDay: () => {},
        titleRef, dateRef, timeRef, linkRef };
    }

    const year = this.state.viewYear, month = this.state.viewMonth;
    const now = new Date();
    const realY = now.getFullYear(), realM = now.getMonth(), realD = now.getDate();
    const monthLabel = new Date(year, month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

    const baseEvents = {
      [`${realY}-${realM}-${realD}`]: [
        { time: '8:00', title: 'Workout', linked: true, cls: '' },
        { time: '9:30', title: 'Team standup', linked: false, cls: 'google' },
        { time: '12:00', title: 'Lunch w/ Sam', linked: false, cls: 'google' },
        { time: '14:00', title: 'Fix prod bug', linked: true, cls: '' },
        { time: '19:00', title: 'Read 20 min', linked: true, cls: '' },
      ],
      [`${realY}-${realM}-${realD + 2}`]: [{ time: '10:00', title: 'Plan Q4 roadmap', linked: true, cls: '' }],
      [`${realY}-${realM}-${Math.max(1, realD - 3)}`]: [{ time: '15:00', title: 'Dentist', linked: false, cls: 'google' }],
    };

    this.state.extraEvents.forEach(ev => {
      const [y, m, d] = ev.date.split('-').map(Number);
      const key = `${y}-${m - 1}-${d}`;
      if (!baseEvents[key]) baseEvents[key] = [];
      baseEvents[key].push({ time: ev.time, title: ev.title, linked: false, cls: '' });
    });

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push({ inMonth: false, cls: 'blank', num: '', events: [] });
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = year === realY && month === realM && d === realD;
      const key = `${year}-${month}-${d}`;
      cells.push({ inMonth: true, cls: isToday ? 'today' : '', num: d, events: baseEvents[key] || [], open: () => this.openDay(year, month, d) });
    }
    while (cells.length % 7 !== 0) cells.push({ inMonth: false, cls: 'blank', num: '', events: [], open: () => {} });

    const parseTime = (t) => { const [h, m] = t.split(':').map(Number); return h + m / 60; };
    const fmtDayHour = (h) => (h === 0 || h === 24) ? '12am' : h === 12 ? '12pm' : h > 12 ? `${h - 12}pm` : `${h}am`;

    const dayDate = this.state.dayDate || new Date(realY, realM, realD);
    const dayYear = dayDate.getFullYear(), dayMonth = dayDate.getMonth(), dayNum = dayDate.getDate();
    const dayLabel = dayDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const dayTotalHours = DAY_END_HOUR - DAY_START_HOUR;
    const dayHourLabels = [];
    for (let h = DAY_START_HOUR; h < DAY_END_HOUR; h++) dayHourLabels.push(fmtDayHour(h));

    const dayKey = `${dayYear}-${dayMonth}-${dayNum}`;
    const dayEvents = (baseEvents[dayKey] || []).map(ev => {
      const start = Math.min(Math.max(parseTime(ev.time), DAY_START_HOUR), DAY_END_HOUR);
      const end = Math.min(start + 1, DAY_END_HOUR);
      const topPct = ((start - DAY_START_HOUR) / dayTotalHours) * 100;
      const heightPct = ((end - start) / dayTotalHours) * 100;
      return { ...ev, posStyle: `top:${topPct}%;height:${heightPct}%` };
    });

    const nowHour = now.getHours() + now.getMinutes() / 60;
    const isViewingToday = dayYear === realY && dayMonth === realM && dayNum === realD;
    const showNowLine = isViewingToday && nowHour >= DAY_START_HOUR && nowHour <= DAY_END_HOUR;
    const nowTopPct = showNowLine ? ((nowHour - DAY_START_HOUR) / dayTotalHours) * 100 : 0;
    const nowLabel = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

    const isMonthView = this.state.viewMode !== 'day';
    const isDayView = this.state.viewMode === 'day';

    return {
      monthLabel, dowLabels: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], cells,
      isMonthView, isDayView, monthToggleClass: isMonthView ? 'active' : '', dayToggleClass: isDayView ? 'active' : '',
      dayLabel, dayHourLabels, dayEvents, showNowLine, nowTopPct, nowLabel,
      dialogOpen: this.state.dialogOpen,
      prevMonth: () => this.prevMonth(), nextMonth: () => this.nextMonth(), goToday: () => this.goToday(),
      showMonth: () => this.showMonth(), showDay: () => this.showDay(), prevDay: () => this.prevDay(), nextDay: () => this.nextDay(),
      sync: () => this.sync(), openDialog: () => this.openDialog(), closeDialog: () => this.closeDialog(),
      stop: (e) => this.stop(e), saveEvent: () => this.saveEvent(),
      titleRef, dateRef, timeRef, linkRef,
    };
  }
}

</script>
</body>
</html>
