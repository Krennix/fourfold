<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./assets/ds/styles.css">
<script src="_ds/industry-fccfab8c-a272-485d-8ff4-a29b0928eafa/_ds_bundle.js"></script>
<style>
.widget{position:relative;border:1px solid var(--color-divider);border-radius:0;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);background:transparent}
.week-grid{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr));gap:6px}
.week-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb, var(--color-text) 55%, transparent);padding:2px 4px;text-align:center}
.time-label{font-size:10.5px;color:color-mix(in srgb, var(--color-text) 45%, transparent);text-align:right;padding-right:6px;padding-top:2px}
.day-col{position:relative;border-left:1px solid var(--color-divider);min-height:560px}
.class-block{position:absolute;left:2px;right:2px;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800);padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden}
.class-block:hover{background:var(--color-accent-200)}
.class-block .cb-name{font-family:var(--font-heading);font-weight:600;font-size:13px;line-height:1.15}
.class-block .cb-meta{font-size:10.5px;opacity:.8}
.class-block .cb-hw{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--color-accent-700)}
.hw-row{display:flex;align-items:center;gap:var(--space-2);padding:7px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 6%, transparent)}
.hw-row:last-child{border-bottom:none}
.hw-check{width:19px;height:19px;flex:none;border:1.5px solid var(--color-divider);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hw-check.done{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg)}
.hw-check svg{width:12px;height:12px}
.hw-title{flex:1;min-width:0;font-size:13.5px}
.hw-title.done{text-decoration:line-through;color:color-mix(in srgb, var(--color-text) 45%, transparent)}
.pill-high{background:var(--color-accent-800);color:var(--color-bg)}
.pill-med{background:var(--color-accent-300);color:var(--color-accent-800)}
.pill-low{background:var(--color-neutral-200);color:var(--color-neutral-800)}
.empty-msg{font-size:12px;color:color-mix(in srgb, var(--color-text) 40%, transparent);text-align:center;padding:var(--space-4) 0}
.time-col{position:relative;grid-column:1/2;display:flex;flex-direction:column}
.now-time{position:absolute;right:6px;width:50px;text-align:right;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--now-color, #f04949);white-space:nowrap}
.now-dot{position:absolute;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--now-color, #f04949);transform:translate(50%,-50%);z-index:6}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--now-color, #f04949);transform:translateY(-50%);z-index:6}
</style>
</helmet>
<div style="display:flex;min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">
<dc-import name="Sidebar" active="school" hint-size="220px,100%"></dc-import>
<main style="flex:1;min-width:0;padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-6);max-width:1320px">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap">
    <div>
      <h6 class="text-muted" style="margin-bottom:6px">School</h6>
      <h1 style="font-size:34px">Class Schedule</h1>
    </div>
    <span class="tag tag-outline">Fall term</span>
  </div>

  <div class="widget blueprint">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="week-grid">
      <div></div>
      <sc-for list="{{ dayLabels }}" as="d" hint-placeholder-count="5"><div class="week-head">{{ d }}</div></sc-for>
      <div class="time-col">
        <sc-for list="{{ hourLabels }}" as="h" hint-placeholder-count="10"><div class="time-label" style="height:56px">{{ h }}</div></sc-for>
        <sc-if value="{{ showNowLine }}" hint-placeholder-val="{{ false }}">
          <span class="now-time" style="top:{{ nowTopPct }}%">{{ nowLabel }}</span>
          <span class="now-dot" style="top:{{ nowTopPct }}%"></span>
        </sc-if>
      </div>
      <sc-for list="{{ dayColumns }}" as="col" hint-placeholder-count="5">
        <div class="day-col">
          <sc-for list="{{ col.classes }}" as="c" hint-placeholder-count="2">
            <div class="class-block" style="{{ c.posStyle }}" onClick="{{ c.open }}">
              <span class="cb-name">{{ c.name }}</span>
              <span class="cb-meta">{{ c.time }} &middot; {{ c.room }}</span>
              <sc-if value="{{ c.hasHomework }}" hint-placeholder-val="{{ false }}"><span class="cb-hw"></span></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ col.showNow }}" hint-placeholder-val="{{ false }}">
            <div class="now-line" style="top:{{ nowTopPct }}%"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ panelClass }}" hint-placeholder-val="{{ false }}">
    <div class="dialog-backdrop" onClick="{{ closePanel }}">
      <div class="dialog" onClick="{{ stop }}" style="width:min(520px,100%)">
        <div class="dialog-title">{{ panelClass.name }}</div>
        <div class="dialog-body" style="margin-bottom:4px">{{ panelClass.time }} &middot; {{ panelClass.room }} &middot; {{ panelClass.days }}</div>

        <h4 style="margin-top:8px">Homework</h4>
        <div>
          <sc-for list="{{ panelHomework }}" as="hw" hint-placeholder-count="2">
            <div class="hw-row">
              <div class="hw-check {{ hw.doneClass }}" onClick="{{ hw.toggle }}">
                <sc-if value="{{ hw.done }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
              </div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
                <span class="hw-title {{ hw.doneClass }}">{{ hw.title }}</span>
                <span class="text-muted" style="font-size:11px">Due {{ hw.due }}</span>
              </div>
              <span class="tag {{ hw.priorityClass }}">{{ hw.priorityLabel }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ noHomework }}" hint-placeholder-val="{{ false }}"><div class="empty-msg" style="font-size:12px;padding:8px 0" >No homework yet</div></sc-if>
        </div>

        <div style="display:flex;gap:var(--space-3);align-items:flex-end;margin-top:6px;flex-wrap:wrap">
          <div class="field" style="flex:2;min-width:160px"><label>New assignment</label><input class="input" type="text" ref="{{ titleRef }}" placeholder="e.g. Problem set 4"></div>
          <div class="field" style="flex:1;min-width:130px"><label>Due date</label><input class="input" type="date" ref="{{ dueRef }}"></div>
          <div class="field" style="flex:1;min-width:110px">
            <label>Priority</label>
            <select class="input" ref="{{ priorityRef }}">
              <option value="high">High</option>
              <option value="med" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <div class="dialog-actions">
          <button class="btn btn-secondary" type="button" onClick="{{ closePanel }}">Close</button>
          <button class="btn btn-primary" type="button" onClick="{{ addHomework }}">Add homework</button>
        </div>
      </div>
    </div>
  </sc-if>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const START_HOUR = 8;
const END_HOUR = 18;
const PRIORITY_LABEL = { high: 'High', med: 'Medium', low: 'Low' };
const PRIORITY_CLASS = { high: 'pill-high', med: 'pill-med', low: 'pill-low' };

class Component extends DCLogic {
  state = {
    openClassId: null,
    classes: [
      { id: 'calc', name: 'Calculus II', room: 'Rm 214', start: 9, end: 10, days: ['Mon', 'Wed', 'Fri'] },
      { id: 'chem', name: 'Chemistry', room: 'Lab B', start: 10.5, end: 12, days: ['Mon', 'Wed'] },
      { id: 'hist', name: 'World History', room: 'Rm 108', start: 13, end: 14, days: ['Tue', 'Thu'] },
      { id: 'cs', name: 'Intro to CS', room: 'Rm 301', start: 14.5, end: 16, days: ['Mon', 'Wed', 'Fri'] },
      { id: 'eng', name: 'English Lit', room: 'Rm 220', start: 11, end: 12, days: ['Tue', 'Thu'] },
    ],
    homework: {
      calc: [{ id: 1, title: 'Problem set 6', due: 'Sep 10', priority: 'high', done: false }],
      cs: [
        { id: 2, title: 'Read chapter 3', due: 'Sep 9', priority: 'low', done: true },
        { id: 3, title: 'Lab 2 writeup', due: 'Sep 12', priority: 'med', done: false },
      ],
    },
  };

  openClass(id) { this.setState({ openClassId: id }); }
  closePanel() { this.setState({ openClassId: null }); }
  stop(e) { e.stopPropagation(); }
  toggleHomework(classId, id) {
    this.setState(s => ({
      homework: { ...s.homework, [classId]: (s.homework[classId] || []).map(h => h.id === id ? { ...h, done: !h.done } : h) },
    }));
  }
  addHomework() {
    const classId = this.state.openClassId;
    if (!classId) return;
    const title = this.titleRef && this.titleRef.value ? this.titleRef.value : 'New assignment';
    const dueRaw = this.dueRef && this.dueRef.value;
    const priority = this.priorityRef && this.priorityRef.value ? this.priorityRef.value : 'med';
    const due = dueRaw ? new Date(dueRaw + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'No date';
    this.setState(s => ({
      homework: { ...s.homework, [classId]: [...(s.homework[classId] || []), { id: Date.now(), title, due, priority, done: false }] },
    }));
    if (this.titleRef) this.titleRef.value = '';
    if (this.dueRef) this.dueRef.value = '';
  }

  renderVals() {
    const titleRef = (el) => { this.titleRef = el; };
    const dueRef = (el) => { this.dueRef = el; };
    const priorityRef = (el) => { this.priorityRef = el; };

    const hourLabels = [];
    for (let h = START_HOUR; h < END_HOUR; h++) hourLabels.push(h > 12 ? `${h - 12}pm` : h === 12 ? '12pm' : `${h}am`);

    const fmtHour = (h) => {
      const hour12 = h % 1 === 0 ? (h > 12 ? h - 12 : h) : (Math.floor(h) > 12 ? Math.floor(h) - 12 : Math.floor(h));
      const mins = h % 1 === 0 ? '00' : '30';
      return `${hour12}:${mins}`;
    };

    const totalHours = END_HOUR - START_HOUR;

    const now = new Date();
    const nowHour = now.getHours() + now.getMinutes() / 60;
    const todayName = DAYS[now.getDay() - 1];
    const showNowLine = !!todayName && nowHour >= START_HOUR && nowHour <= END_HOUR;
    const nowTopPct = showNowLine ? ((nowHour - START_HOUR) / totalHours) * 100 : 0;
    const nowLabel = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

    const dayColumns = DAYS.map(day => {
      const classes = this.state.classes.filter(c => c.days.includes(day)).map(c => {
        const topPct = ((c.start - START_HOUR) / totalHours) * 100;
        const heightPct = ((c.end - c.start) / totalHours) * 100;
        const startLabel = fmtHour(c.start);
        const endLabel = fmtHour(c.end);
        const hw = this.state.homework[c.id] || [];
        return {
          ...c, time: `${startLabel}\u2013${endLabel}`,
          posStyle: `top:${topPct}%;height:${heightPct}%`,
          hasHomework: hw.some(h => !h.done),
          open: () => this.openClass(c.id),
        };
      });
      return { day, classes, showNow: showNowLine && day === todayName };
    });

    const openClassId = this.state.openClassId;
    const cls = this.state.classes.find(c => c.id === openClassId);
    const panelClass = cls ? { ...cls, time: `${fmtHour(cls.start)}\u2013${fmtHour(cls.end)}`, days: cls.days.join('/') } : null;
    const panelHomework = cls ? (this.state.homework[cls.id] || []).map(h => ({
      ...h, doneClass: h.done ? 'done' : '', priorityLabel: PRIORITY_LABEL[h.priority], priorityClass: PRIORITY_CLASS[h.priority],
      toggle: () => this.toggleHomework(cls.id, h.id),
    })) : [];

    return {
      dayLabels: DAYS, hourLabels, dayColumns,
      showNowLine, nowTopPct, nowLabel,
      panelClass, panelHomework, noHomework: cls ? panelHomework.length === 0 : false,
      closePanel: () => this.closePanel(), stop: (e) => this.stop(e), addHomework: () => this.addHomework(),
      titleRef, dueRef, priorityRef,
    };
  }
}

</script>
</body>
</html>
