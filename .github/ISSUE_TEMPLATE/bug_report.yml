name: Bug report
description: Something in FourFold is broken or not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search
        [existing issues](https://github.com/Krennix/fourfold/issues) first to
        avoid duplicates.

        **Found a security vulnerability instead?** Please don't file it here —
        see [SECURITY.md](https://github.com/Krennix/fourfold/blob/main/SECURITY.md).
        Minor security issues have their own template.

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Home dashboard
        - Eisenhower Matrix
        - Habit Tracker
        - Calendar (Google sync)
        - Pomodoro Timer
        - Spotify integration
        - School / homework tracking
        - Scheduling agent
        - Sign-in / auth
        - Settings
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / console errors
      description: If applicable, add screenshots or paste any browser console / server logs.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS, and whether you're running this locally (`vercel dev`) or on a deployment.
      placeholder: e.g. Chrome 129 on macOS, self-hosted on Vercel

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
